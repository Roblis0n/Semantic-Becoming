<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">原来的24项解决什么</title><desc id="desc">状态、算子、响应、信念、约束、续接六类小图。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
<text id="e001" x="64" y="82.48" font-family="Noto Serif CJK SC" font-size="44" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="64" dy="0">原来的24项解决什么</tspan>
</text>
<text id="e002" x="64" y="146.36" font-family="Noto Sans CJK SC" font-size="33" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">把文字消息升级为可计算对象</tspan>
</text>
<polyline id="e003" points="64.000,658.000 1216.000,658.000" fill="none" stroke="#CECDBF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<text id="e004" x="64" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">前沿机制提案 / 无模型实测</tspan>
</text>
<text id="e005" x="1216" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="end">
<tspan x="1216" dy="0">03 / 36</tspan>
</text>
<rect id="e006" x="64" y="230" width="364" height="133" rx="8" fill="#E4EAD9" stroke="#536647" stroke-width="2" />
<text id="e007" x="79" y="276.28" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#536647" text-anchor="start">
<tspan x="79" dy="0">状态</tspan>
</text>
<text id="e008" x="79" y="316.66" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="79" dy="0">可续接的内部对象</tspan>
</text>
<rect id="e009" x="458" y="230" width="364" height="133" rx="8" fill="#F0DDD1" stroke="#9C5138" stroke-width="2" />
<text id="e010" x="473" y="276.28" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#9C5138" text-anchor="start">
<tspan x="473" dy="0">算子</tspan>
</text>
<text id="e011" x="473" y="316.66" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="473" dy="0">有序复合的作用</tspan>
</text>
<rect id="e012" x="852" y="230" width="364" height="133" rx="8" fill="#E1E9EA" stroke="#496974" stroke-width="2" />
<text id="e013" x="867" y="276.28" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#496974" text-anchor="start">
<tspan x="867" dy="0">响应</tspan>
</text>
<text id="e014" x="867" y="316.66" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="867" dy="0">带局部有效域</tspan>
</text>
<rect id="e015" x="64" y="395" width="364" height="133" rx="8" fill="#E9E1EC" stroke="#725D7C" stroke-width="2" />
<text id="e016" x="79" y="441.28" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#725D7C" text-anchor="start">
<tspan x="79" dy="0">信念</tspan>
</text>
<text id="e017" x="79" y="481.66" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="79" dy="0">保留不确定性</tspan>
</text>
<rect id="e018" x="458" y="395" width="364" height="133" rx="8" fill="#E4EAD9" stroke="#536647" stroke-width="2" />
<text id="e019" x="473" y="441.28" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#536647" text-anchor="start">
<tspan x="473" dy="0">约束</tspan>
</text>
<text id="e020" x="473" y="481.66" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="473" dy="0">限制可行域</tspan>
</text>
<rect id="e021" x="852" y="395" width="364" height="133" rx="8" fill="#E1E9EA" stroke="#496974" stroke-width="2" />
<text id="e022" x="867" y="441.28" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#496974" text-anchor="start">
<tspan x="867" dy="0">续接</tspan>
</text>
<text id="e023" x="867" y="481.66" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="867" dy="0">移交未完成计算</tspan>
</text>
<text id="e024" x="64" y="630.92" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="64" dy="0">H01–H24 保留：消息到达后，接收方能继续操作</tspan>
</text>
</svg>