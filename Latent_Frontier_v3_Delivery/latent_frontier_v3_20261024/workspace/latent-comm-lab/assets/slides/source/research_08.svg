<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H36：反例不是一句反对</title><desc id="desc">命题→候选反例→执行检查→修订，文字争论旁路标未证。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
