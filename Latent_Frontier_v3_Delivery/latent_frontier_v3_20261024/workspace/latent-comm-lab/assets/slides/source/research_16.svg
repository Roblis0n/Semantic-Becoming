</text>
<text id="e005" x="1216" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="end">
<tspan x="1216" dy="0">16 / 36</tspan>
</text>
<rect id="e006" x="64.0" y="260" width="362.6666666666667" height="170" rx="8" fill="#E1E9EA" stroke="#496974" stroke-width="2" />
