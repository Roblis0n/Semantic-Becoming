</text>
<text id="e013" x="473.6666666666667" y="346.66" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="473.6666666666667" dy="0">同一事务边界</tspan>
</text>
<polyline id="e014" points="827.333,345.000 847.333,345.000" fill="none" stroke="#606258" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<polyline id="e015" points="835.333,340.000 847.333,345.000 835.333,350.000" fill="none" stroke="#606258" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<rect id="e016" x="853.3333333333334" y="260" width="362.6666666666667" height="170" rx="8" fill="#E4EAD9" stroke="#536647" stroke-width="2" />
<text id="e017" x="868.3333333333334" y="306.28" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#536647" text-anchor="start">
