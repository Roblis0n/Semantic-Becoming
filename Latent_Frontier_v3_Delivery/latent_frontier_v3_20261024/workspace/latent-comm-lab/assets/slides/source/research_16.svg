<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H39：结构改动也要能撤销</title><desc id="desc">概念、ISA、adapter三张版本卡在同一事务边界。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
<text id="e001" x="64" y="82.48" font-family="Noto Serif CJK SC" font-size="44" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="64" dy="0">H39：结构改动也要能撤销</tspan>
</text>
<text id="e002" x="64" y="146.36" font-family="Noto Sans CJK SC" font-size="33" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">版本快照→候选修改→提交或分叉</tspan>
</text>
