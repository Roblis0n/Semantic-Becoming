</text>
<rect id="e006" x="64.0" y="260" width="362.6666666666667" height="170" rx="8" fill="#E1E9EA" stroke="#496974" stroke-width="2" />
<text id="e007" x="79.0" y="303.52" font-family="Noto Sans CJK SC" font-size="31" font-weight="700" fill="#496974" text-anchor="start">
