<polyline id="e009" points="432.667,345.000 452.667,345.000" fill="none" stroke="#606258" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<polyline id="e010" points="440.667,340.000 452.667,345.000 440.667,350.000" fill="none" stroke="#606258" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<rect id="e011" x="458.6666666666667" y="260" width="362.6666666666667" height="170" rx="8" fill="#F0DDD1" stroke="#9C5138" stroke-width="2" />
<text id="e012" x="473.6666666666667" y="303.52" font-family="Noto Sans CJK SC" font-size="31" font-weight="700" fill="#9C5138" text-anchor="start">
<tspan x="473.6666666666667" dy="0">方向运输 H37</tspan>
</text>
<text id="e013" x="473.6666666666667" y="342.91" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
