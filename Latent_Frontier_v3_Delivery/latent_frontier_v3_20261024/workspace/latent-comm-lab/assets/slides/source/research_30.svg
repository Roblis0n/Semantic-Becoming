<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H45与H46：未知也有结构</title><desc id="desc">候选假设→查询分割→条件排除，unknown保留。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
<text id="e001" x="64" y="82.48" font-family="Noto Serif CJK SC" font-size="44" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="64" dy="0">H45与H46：未知也有结构</tspan>
</text>
<text id="e002" x="64" y="146.36" font-family="Noto Sans CJK SC" font-size="33" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">什么能区分，什么在何条件下不可能</tspan>
</text>
<polyline id="e003" points="64.000,658.000 1216.000,658.000" fill="none" stroke="#CECDBF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<text id="e004" x="64" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">前沿机制提案 / 无模型实测</tspan>
</text>
<text id="e005" x="1216" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="end">
<tspan x="1216" dy="0">30 / 36</tspan>
</text>
<rect id="e006" x="64.0" y="270" width="362.6666666666667" height="170" rx="8" fill="#E1E9EA" stroke="#496974" stroke-width="2" />
<text id="e007" x="79.0" y="315.36" font-family="Noto Sans CJK SC" font-size="33" font-weight="700" fill="#496974" text-anchor="start">
<tspan x="79.0" dy="0">候选假设集</tspan>
</text>
<text id="e008" x="79.0" y="355.41" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="79.0" dy="0">哪些仍然可行？</tspan>
</text>
<polyline id="e009" points="432.667,355.000 452.667,355.000" fill="none" stroke="#606258" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<polyline id="e010" points="440.667,350.000 452.667,355.000 440.667,360.000" fill="none" stroke="#606258" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<rect id="e011" x="458.6666666666667" y="270" width="362.6666666666667" height="170" rx="8" fill="#E4EAD9" stroke="#536647" stroke-width="2" />
<text id="e012" x="473.6666666666667" y="315.36" font-family="Noto Sans CJK SC" font-size="33" font-weight="700" fill="#536647" text-anchor="start">
<tspan x="473.6666666666667" dy="0">合法查询</tspan>
</text>
<text id="e013" x="473.6666666666667" y="355.41" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="473.6666666666667" dy="0">怎样划分候选？</tspan>
</text>
<polyline id="e014" points="827.333,355.000 847.333,355.000" fill="none" stroke="#606258" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<polyline id="e015" points="835.333,350.000 847.333,355.000 835.333,360.000" fill="none" stroke="#606258" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<rect id="e016" x="853.3333333333334" y="270" width="362.6666666666667" height="170" rx="8" fill="#F0DDD1" stroke="#9C5138" stroke-width="2" />
<text id="e017" x="868.3333333333334" y="315.36" font-family="Noto Sans CJK SC" font-size="33" font-weight="700" fill="#9C5138" text-anchor="start">
<tspan x="868.3333333333334" dy="0">条件排除</tspan>
</text>
<text id="e018" x="868.3333333333334" y="355.41" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="868.3333333333334" dy="0">何假设下不可能？</tspan>
</text>
<text id="e019" x="64" y="531.28" font-family="Noto Sans CJK SC" font-size="34" font-weight="400" fill="#725D7C" text-anchor="start">
<tspan x="64" dy="0">无合法查询 / 超时未找到：unknown</tspan>
</text>
<text id="e020" x="64" y="630.92" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="64" dy="0">“尚未找到”不等于“不可能”；负知识必须带前提与见证</tspan>
</text>
</svg>