<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">第二条主线：传递怎样学习</title><desc id="desc">答案消息、行为方向、更新规则三个不同对象。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
