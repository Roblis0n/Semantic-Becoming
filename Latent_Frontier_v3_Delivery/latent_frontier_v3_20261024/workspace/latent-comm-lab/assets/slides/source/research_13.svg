<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H37：在行为空间运更新</title><desc id="desc">v=J_AΔθ_A；目标解最小二乘，箭头区分可达与残差。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
