<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H25：不必有万能潜语言</title><desc id="desc">两套坐标的同一算子，显示T′=GTG⁻¹。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
