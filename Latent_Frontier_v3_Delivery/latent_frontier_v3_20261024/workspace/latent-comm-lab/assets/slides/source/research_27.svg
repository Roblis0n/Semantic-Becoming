<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H30：类比是可以执行的映射</title><desc id="desc">f(x)=2x的交换方块，源加1映为目标加2。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
