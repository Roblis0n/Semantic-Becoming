<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">这轮到底交付什么</title><desc id="desc">已设计／交Dot实现／研究未运行三列。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
