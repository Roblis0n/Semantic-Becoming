<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">第一条主线：概念出生</title><desc id="desc">钥匙例：形状相同，权限有效期不同。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
