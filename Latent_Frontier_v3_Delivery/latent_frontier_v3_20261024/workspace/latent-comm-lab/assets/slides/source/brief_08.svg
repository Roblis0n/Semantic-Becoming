<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">第三条主线：共同制造世界</title><desc id="desc">两个局部转移核拼出新世界，注释synthetic。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
<text id="e001" x="64" y="82.48" font-family="Noto Serif CJK SC" font-size="44" font-weight="400" fill="#262A25" text-anchor="start">
