<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">一个能够手算的运输例</title><desc id="desc">数轴4×.25=1；加入λ=1显示4/17，标解析示意。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
<text id="e001" x="64" y="82.48" font-family="Noto Serif CJK SC" font-size="44" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="64" dy="0">一个能够手算的运输例</tspan>
</text>
<text id="e002" x="64" y="146.36" font-family="Noto Sans CJK SC" font-size="33" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">J_B=4，目标行为变化1，δ=.25</tspan>
</text>
<polyline id="e003" points="64.000,658.000 1216.000,658.000" fill="none" stroke="#CECDBF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<text id="e004" x="64" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">解析示意 / 数学示意 · 无模型实测</tspan>
</text>
<text id="e005" x="1216" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="end">
<tspan x="1216" dy="0">14 / 36</tspan>
</text>
<text id="e006" x="64" y="248.52" font-family="Noto Sans CJK SC" font-size="31" font-weight="400" fill="#536647" text-anchor="start">
<tspan x="64" dy="0">无正则化：λ = 0</tspan>
</text>
<text id="e007" x="64" y="350.2" font-family="Noto Serif CJK SC" font-size="60" font-weight="400" fill="#536647" text-anchor="start">
<tspan x="64" dy="0">4 × 0.25 = 1</tspan>
</text>
<text id="e008" x="64" y="429.44" font-family="Noto Sans CJK SC" font-size="32" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="64" dy="0">目标行为变化 1</tspan>
<tspan x="64" dy="43.2">目标参数改动 δ = 1/4</tspan>
</text>
<polyline id="e009" points="640.000,230.000 640.000,550.000" fill="none" stroke="#CECDBF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<text id="e010" x="700" y="248.52" font-family="Noto Sans CJK SC" font-size="31" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="700" dy="0">加入正则化：λ = 1</tspan>
</text>
<text id="e011" x="700" y="350.2" font-family="Noto Serif CJK SC" font-size="60" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="700" dy="0">δ = 4/17</tspan>
</text>
<text id="e012" x="700" y="429.44" font-family="Noto Sans CJK SC" font-size="32" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="700" dy="0">实现变化 16/17</tspan>
<tspan x="700" dy="43.2">残差 1/17 仍保留</tspan>
</text>
<text id="e013" x="64" y="630.92" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="64" dy="0">解析式 δ = 4 / (16 + λ)；手算正确不代表真实模型运输有效</tspan>
</text>
</svg>