<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H31：因果模块不是参数碎片</title><desc id="desc">y=2x接入z=y+1，显示边界与共享噪声标记。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
