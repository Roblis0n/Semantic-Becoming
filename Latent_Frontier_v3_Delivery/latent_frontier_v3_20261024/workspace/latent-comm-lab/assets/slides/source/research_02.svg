<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">我们究竟放开哪些假设</title><desc id="desc">四个锁依次打开，外层权限/用户目标边框保持不动。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
<text id="e001" x="64" y="82.48" font-family="Noto Serif CJK SC" font-size="44" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="64" dy="0">我们究竟放开哪些假设</tspan>
</text>
<text id="e002" x="64" y="146.36" font-family="Noto Sans CJK SC" font-size="33" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">固定模型、固定词汇、固定问题、固定更新规则都不是唯一选择</tspan>
</text>
<polyline id="e003" points="64.000,658.000 1216.000,658.000" fill="none" stroke="#CECDBF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<text id="e004" x="64" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">前沿机制提案 / 无模型实测</tspan>
</text>
<text id="e005" x="1216" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="end">
<tspan x="1216" dy="0">02 / 36</tspan>
</text>
<text id="e006" x="90" y="313.0" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#536647" text-anchor="start">
<tspan x="90" dy="0">可改写</tspan>
</text>
<text id="e007" x="90" y="374.04" font-family="Noto Serif CJK SC" font-size="37" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="90" dy="0">模型个体</tspan>
</text>
<text id="e008" x="380" y="313.0" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="380" dy="0">可改写</tspan>
</text>
<text id="e009" x="380" y="374.04" font-family="Noto Serif CJK SC" font-size="37" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="380" dy="0">概念词汇</tspan>
</text>
<text id="e010" x="670" y="313.0" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#496974" text-anchor="start">
<tspan x="670" dy="0">可改写</tspan>
</text>
<text id="e011" x="670" y="374.04" font-family="Noto Serif CJK SC" font-size="37" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="670" dy="0">问题集合</tspan>
</text>
<text id="e012" x="960" y="313.0" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#725D7C" text-anchor="start">
<tspan x="960" dy="0">可改写</tspan>
</text>
<text id="e013" x="960" y="374.04" font-family="Noto Serif CJK SC" font-size="37" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="960" dy="0">更新规则</tspan>
</text>
<rect id="e014" x="64" y="230" width="1152" height="235" rx="0" fill="none" stroke="#262A25" stroke-width="2" />
<text id="e015" x="90" y="528.28" font-family="Noto Sans CJK SC" font-size="34" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="90" dy="0">外层不变：用户目标、权限和运行预算</tspan>
</text>
<text id="e016" x="64" y="630.92" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="64" dy="0">开放内部结构，不授予系统修改用户任务或账号权限的权力</tspan>
</text>
</svg>