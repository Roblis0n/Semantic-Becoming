<text id="e018" x="79" y="466.68" font-family="Noto Sans CJK SC" font-size="29" font-weight="700" fill="#725D7C" text-anchor="start">
<tspan x="79" dy="0">ledger / receipt</tspan>
</text>
<text id="e019" x="79" y="505.41" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
