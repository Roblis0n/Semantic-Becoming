</text>
<polyline id="e015" points="340.000,290.000 463.000,290.000" fill="none" stroke="#496974" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<polyline id="e016" points="451.000,285.000 463.000,290.000 451.000,295.000" fill="none" stroke="#496974" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
