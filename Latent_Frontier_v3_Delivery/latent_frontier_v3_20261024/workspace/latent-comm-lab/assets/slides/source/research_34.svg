<text id="e029" x="64" y="630.92" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="64" dy="0">应用级权限防线，不声称已验证硬沙箱；未授权动作不执行</tspan>
