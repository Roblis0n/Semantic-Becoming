<text id="e010" x="490" y="272.6" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#536647" text-anchor="start">
<tspan x="490" dy="0">任务 DAG / owner</tspan>
</text>
<text id="e011" x="490" y="311.66" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="490" dy="0">每文件只有一个写入者</tspan>
</text>
<rect id="e012" x="925" y="230" width="290" height="120" rx="8" fill="#F0DDD1" stroke="#9C5138" stroke-width="2" />
<text id="e013" x="940" y="272.6" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#9C5138" text-anchor="start">
<tspan x="940" dy="0">WORK_ROOT</tspan>
</text>
<text id="e014" x="940" y="311.66" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
