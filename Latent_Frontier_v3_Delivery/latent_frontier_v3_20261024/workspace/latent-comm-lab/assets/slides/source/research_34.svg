</text>
<text id="e005" x="1216" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="end">
<tspan x="1216" dy="0">34 / 36</tspan>
</text>
<rect id="e006" x="64" y="230" width="270" height="120" rx="8" fill="#E1E9EA" stroke="#496974" stroke-width="2" />
<text id="e007" x="79" y="272.6" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#496974" text-anchor="start">
<tspan x="79" dy="0">PLAN_ROOT</tspan>
</text>
<text id="e008" x="79" y="311.66" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#262A25" text-anchor="start">
