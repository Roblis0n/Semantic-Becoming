<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H26：没有全局解也有知识</title><desc id="desc">三点约束x−y=0、y−z=0、z−x=1，最后显示0=1。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
<text id="e001" x="64" y="82.48" font-family="Noto Serif CJK SC" font-size="44" font-weight="400" fill="#262A25" text-anchor="start">
<tspan x="64" dy="0">H26：没有全局解也有知识</tspan>
</text>
<text id="e002" x="64" y="146.36" font-family="Noto Sans CJK SC" font-size="33" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">局部一致不必能拼成一个世界</tspan>
</text>
<polyline id="e003" points="64.000,658.000 1216.000,658.000" fill="none" stroke="#CECDBF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<text id="e004" x="64" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="start">
<tspan x="64" dy="0">解析示意 / 数学示意 · 无模型实测</tspan>
</text>
<text id="e005" x="1216" y="691.56" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#606258" text-anchor="end">
<tspan x="1216" dy="0">07 / 36</tspan>
</text>
<text id="e006" x="250" y="280.88" font-family="Noto Sans CJK SC" font-size="39" font-weight="400" fill="#536647" text-anchor="start">
<tspan x="250" dy="0">x − y = 0</tspan>
</text>
<text id="e007" x="820" y="280.88" font-family="Noto Sans CJK SC" font-size="39" font-weight="400" fill="#496974" text-anchor="start">
<tspan x="820" dy="0">y − z = 0</tspan>
</text>
<text id="e008" x="525" y="495.88" font-family="Noto Sans CJK SC" font-size="39" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="525" dy="0">z − x = 1</tspan>
</text>
<polyline id="e009" points="470.000,300.000 810.000,300.000" fill="none" stroke="#CECDBF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<polyline id="e010" points="290.000,325.000 530.000,440.000" fill="none" stroke="#CECDBF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<polyline id="e011" points="980.000,325.000 760.000,440.000" fill="none" stroke="#CECDBF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<text id="e012" x="525" y="374.96" font-family="Noto Sans CJK SC" font-size="38" font-weight="400" fill="#9C4540" text-anchor="start">
<tspan x="525" dy="0">求和：0 = 1</tspan>
</text>
<text id="e013" x="64" y="630.92" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#9C5138" text-anchor="start">
<tspan x="64" dy="0">冲突见证保留；最小二乘近似不会让不一致约束同时成立</tspan>
</text>
</svg>