<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H48：十次转述不是十份证据</title><desc id="desc">两个转述共同指向e，P=.8；独立误算.96划掉。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
<text id="e001" x="64" y="82.48" font-family="Noto Serif CJK SC" font-size="44" font-weight="400" fill="#262A25" text-anchor="start">
