<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H43 / H44：共同构造可行动的世界</title><desc id="desc">核 A 和核 B 使用同一个公平比特 u。有限合成观测附 kernel 来源，不作为独立现实证据。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
