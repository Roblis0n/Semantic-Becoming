<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H43 / H44：共同构造可行动的世界</title><style>body{margin:0;background:#F4F1E8;color:#262A25;font:18px system-ui,sans-serif}main{max-width:1280px;margin:auto}svg{width:100%;height:auto;display:block}nav,p{margin:16px 5%;line-height:1.6}button,input{font:inherit;margin-right:14px}input{width:45%}:focus-visible{outline:3px solid #496974}details{margin:16px 5%}a{color:#496974}</style><main><div id="art"></div><nav aria-label="动画播放控制"><button id="play">播放</button><button id="restart">从头</button><input aria-label="动画时间" id="seek" type="range" min="0" step="0.05"><output id="time"></output></nav><p id="explanation" aria-live="polite"></p><details><summary>动画与研究边界</summary><p>所有数字为解析示意 / 数学示意，无模型实测。无旁白音频。减少动态偏好下默认呈现完整终态，仍可逐步拖动时间线。</p><p><a href="scene.json">可编辑时间线与语义合同</a> · <a href="source.svg">可编辑 SVG</a></p></details></main><script src="../animation_engine.js"></script><script>
const id="A05",A=FrontierAnimations,a=A.data[id],seek=document.querySelector('#seek'),out=document.querySelector('#time'),button=document.querySelector('#play');seek.max=a.duration;let t=matchMedia('(prefers-reduced-motion: reduce)').matches?a.duration:0,playing=false,last=0,lastStep=-1;
function draw(){document.querySelector('#art').innerHTML=A.svg(A.frame(id,t));seek.value=t;out.textContent=t.toFixed(1)+' / '+a.duration+' 秒';const ix=a.steps.findLastIndex(s=>s.t<=t);if(ix!==lastStep){const s=a.steps[ix];document.querySelector('#explanation').textContent='事实：'+s.fact+'。解释：'+s.explanation+'。下一步：'+s.next+'。';lastStep=ix;}}
function tick(now){if(playing){t=Math.min(a.duration,t+(now-last)/1000);draw();if(t>=a.duration){playing=false;button.textContent='重播';}}last=now;requestAnimationFrame(tick);}button.onclick=()=>{if(t>=a.duration)t=0;playing=!playing;button.textContent=playing?'暂停':'播放';};document.querySelector('#restart').onclick=()=>{playing=false;t=0;button.textContent='播放';draw();};seek.oninput=()=>{playing=false;button.textContent='播放';t=+seek.value;draw();};matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches){playing=false;t=a.duration;button.textContent='播放';draw();}});draw();requestAnimationFrame(tick);
</script></html>
