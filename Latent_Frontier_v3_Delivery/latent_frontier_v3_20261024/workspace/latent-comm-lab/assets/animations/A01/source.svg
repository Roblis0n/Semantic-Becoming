<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H25：换基保持作用</title><desc id="desc">两条路径得到同一个结果 (6,2)。T=diag(2,3)，G 交换坐标。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
