<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H25：换基保持作用</title><desc id="desc">两条路径都得到 (6, 2)。此例作用关系保持。下一步：真实模型对应仍待研究</desc><rect width="1280" height="720" fill="#F4F1E8"/>
