</text>
<polyline id="e012" points="250,270 250,365" fill="none" stroke="#536647" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<polyline id="e013" points="255,353 250,365 245,353" fill="none" stroke="#536647" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text id="e014" x="290" y="323.92" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#536647" text-anchor="start">
