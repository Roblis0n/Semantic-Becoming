</text>
<polyline id="e009" points="455,240 810,240" fill="none" stroke="#9C5138" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<polyline id="e010" points="798,235 810,240 798,245" fill="none" stroke="#9C5138" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text id="e011" x="680" y="213.92000000000002" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#9C5138" text-anchor="middle">
