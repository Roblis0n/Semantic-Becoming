<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">H37：从行为变化求目标更新</title><desc id="desc">标量目标雅可比为四，目标行为变化为一，最小二乘参数改动为四分之一。加单位正则后为四除十七。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
