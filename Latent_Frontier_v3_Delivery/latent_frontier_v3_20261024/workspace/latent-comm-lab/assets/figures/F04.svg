<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">世界核的共同梦境</title><desc id="desc">两个世界核共享外生变量和动作接口，产生带来源的合成观测与新问题。现实证据在独立命名空间，不接受合成观测作为独立现实证据回流。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
