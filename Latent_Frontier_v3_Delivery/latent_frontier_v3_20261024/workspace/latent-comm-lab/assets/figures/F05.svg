<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">多尺度任务语义</title><desc id="desc">任务相对语义：奇偶查询将一三与二四分别归类。添加大于二查询并拥有原始信息后，细化为四个单元素类；粗表示不能无中生有恢复已丢信息。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
<text id="e001" x="64" y="82.48" font-family="Noto Serif CJK SC" font-size="44" font-weight="400" fill="#262A25" text-anchor="start">
