<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">概念诞生的四步</title><desc id="desc">钥匙有效期例：旧类别有冲突，反例区分行为，定义授权有效期谓词，旧读者迁移。若无候选概念则保留未决分支。</desc><rect width="1280" height="720" fill="#F4F1E8"/>
